apiVersion: apps/v1
kind: Deployment
metadata:
  name: fylo-dark-theme-landing-page-master-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fylo-dark-theme-landing-page-master-app
  template:
    metadata:
      labels:
        app: fylo-dark-theme-landing-page-master-app
    spec:
      containers:
        - name: fylo-dark-theme-landing-page-master-app
          image: fylo-dark-theme-landing-page-master-app:latest
          ports:
            - containerPort: 80
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /FyloDarkThemeLandingPage/
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
